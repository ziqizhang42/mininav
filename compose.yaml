services:
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    container_name: mininav-db
    environment:
      POSTGRES_DB: mininav
      POSTGRES_USER: mininav
      POSTGRES_PASSWORD: mininav
    ports:
      - "5432:5432"
    volumes:
      - mininav_pgdata:/var/lib/postgresql

  nominatim:
    image: mediagis/nominatim:5.3
    container_name: mininav-nominatim
    shm_size: 1g
    environment:
      PBF_PATH: /osm/alberta-260619.osm.pbf
      IMPORT_STYLE: full
      FREEZE: "true"
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: nominatim
      THREADS: "4"
    ports:
      - "8080:8080"
    volumes:
      - ./data/osm:/osm:ro
      - mininav_nominatim_pgdata:/var/lib/postgresql/16/main

  backend:
    build: ./backend
    container_name: mininav-backend
    command: uv run python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_ALLOWED_HOSTS: backend
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_DEBUG: "true"
      DB_NAME: mininav
      DB_USER: mininav
      DB_PASSWORD: mininav
      DB_HOST: db
      DB_PORT: "5432"
      NOMINATIM_BASE_URL: http://nominatim:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data/osm:/data/osm:ro
    depends_on:
      - db
      - nominatim

  frontend:
    build: ./frontend
    container_name: mininav-frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - mininav_frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() =>
          process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    container_name: mininav-e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
    init: true
    ipc: host
    volumes:
      - ./frontend/playwright-report:/app/playwright-report
      - ./frontend/test-results:/app/test-results
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  mininav_pgdata:
  mininav_frontend_node_modules:
  mininav_nominatim_pgdata:
