name: mininav-production

services:
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: mininav
      POSTGRES_USER: mininav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - mininav_pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mininav -d mininav"]
      interval: 5s
      timeout: 5s
      retries: 20

  nominatim:
    image: mediagis/nominatim:5.3
    shm_size: 1g
    environment:
      PBF_PATH: /osm/alberta-latest.osm.pbf
      IMPORT_STYLE: full
      FREEZE: "true"
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?NOMINATIM_PASSWORD must be set}
      THREADS: ${NOMINATIM_THREADS:-4}
    volumes:
      - ./data/osm:/osm:ro
      - mininav_nominatim_pgdata:/var/lib/postgresql/16/main
    restart: unless-stopped

  backend:
    build: ./backend
    command:
      [
        "uv",
        "run",
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "1",
        "--timeout",
        "120",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
      ]
    environment:
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?DOMAIN must be set}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "false"
      DB_NAME: mininav
      DB_USER: mininav
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DB_HOST: db
      DB_PORT: "5432"
      NOMINATIM_BASE_URL: http://nominatim:8080
    volumes:
      - ./data/osm:/data/osm:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - mininav_caddy_data:/data
      - mininav_caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mininav_pgdata:
  mininav_nominatim_pgdata:
  mininav_caddy_data:
  mininav_caddy_config:
