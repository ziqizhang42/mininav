name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: mininav
          POSTGRES_USER: mininav
          POSTGRES_PASSWORD: mininav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mininav -d mininav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-secret-key
      DB_NAME: mininav
      DB_USER: mininav
      DB_PASSWORD: mininav
      DB_HOST: localhost
      DB_PORT: "5432"
      NOMINATIM_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build backend image
        run: docker build --tag mininav-backend:ci ./backend

      - name: Ruff lint
        run: docker run --rm mininav-backend:ci uv run ruff check .

      - name: Ruff format check
        run: docker run --rm mininav-backend:ci uv run ruff format --check .

      - name: Django system check
        run: >
          docker run --rm
          -e DJANGO_ALLOWED_HOSTS
          -e DJANGO_DEBUG
          -e DJANGO_SECRET_KEY
          -e DB_NAME
          -e DB_USER
          -e DB_PASSWORD
          -e DB_HOST
          -e DB_PORT
          -e NOMINATIM_BASE_URL
          mininav-backend:ci
          uv run python manage.py check

      - name: Run backend tests
        run: >
          docker run --rm
          --network host
          -e DJANGO_ALLOWED_HOSTS
          -e DJANGO_DEBUG
          -e DJANGO_SECRET_KEY
          -e DB_NAME
          -e DB_USER
          -e DB_PASSWORD
          -e DB_HOST
          -e DB_PORT
          -e NOMINATIM_BASE_URL
          mininav-backend:ci
          uv run pytest
