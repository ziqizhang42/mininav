[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.1",
    "gunicorn>=23.0.0",
    "osmium>=4.3.1",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.18",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
